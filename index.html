<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <script src="https://kit.fontawesome.com/394d725530.js" crossorigin="anonymous"></script>
    <title>호텔예약</title>
</head>
<body>
    <page-header></page-header>
    <section class="swiper home-slider">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <img src="img/slide1.jpg" alt="slide1">
                <div class="slide-text">
                    <h2>SWEET MOMENT</h2>
                    <a href="#">SEE MORE</a>
                </div>
            </div>
            <div class="swiper-slide">
                <img src="img/slide2.jpg" alt="slide2">
                <div class="slide-text">
                    <h2>URBAN RESORT</h2>
                    <a href="#">SEE MORE</a>
                </div>
            </div>
            <div class="swiper-slide">
                <img src="img/slide3.jpg" alt="slide3">
                <div class="slide-text">
                    <h2>RELAX & RELIEF</h2>
                    <a href="#">SEE MORE</a>
                </div>
            </div>
        </div>
        <div class="swiper-pagination"></div>
    </section>
    <section class="content">
        <div class="content-section">
            <h2 class="section-title">ROOMS</h2>
            <div class="scroll-track" id="roomsTrack">
                <div class="scroll-inner">
                    <img src="img/room1.jpg" alt="room1">
                    <img src="img/room2.jpg" alt="room2">
                    <img src="img/room3.jpg" alt="room3">
                    <img src="img/room4.jpg" alt="room4">
                    <img src="img/room5.jpg" alt="room5">
                </div>
            </div>
        </div>
        <div class="content-section">
            <h2 class="section-title">EVENT</h2>
            <div class="scroll-track" id="eventTrack">
                <div class="scroll-inner">
                    <div class="event-card">
                        <img src="img/event1.jpg" alt="event1">
                        <p>봄 특가 이벤트</p>
                    </div>
                    <div class="event-card">
                        <img src="img/event2.jpg" alt="event2">
                        <p>5월 주요행사</p>
                    </div>
                    <div class="event-card">
                        <img src="img/event3.jpg" alt="event3">
                        <p>새로운 객실을 기대해 주세요.</p>
                    </div>
                    <div class="event-card">
                        <img src="img/event4.jpg" alt="event4">
                        <p>스파 프로그램 할인</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-overlay" id="modalOverlay">
            <img class="modal-img" id="modalImg" src="" alt="modal">
        </div>
    </section>
    <section class="bottom-title">
        <div class="bottom-title-inner">
            <div class="award">
                <i class="fa-solid fa-award"></i>
            </div>
            <h2 class="bottom-title-heading">2024 BEST HOTEL</h2>
            <p class="bottom-title-desc">
                Can one ever remember love<br>
                Its like trying to summon up<br>
                the smell of rose sin a cellar.<br>
                you might see a rose, but never the perfume.
            </p>
        </div>
    </section>
    <top-button></top-button>
    <page-footer></page-footer>
    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="js/swiper.js"></script>
</body>
</html>
